// Compose compiler stability configuration.
//
// OpenSefer's domain models live in :shared, which is deliberately Compose-free (it has no Compose
// compiler), so Compose treats its types as UNSTABLE by default. They are, however, immutable by API
// contract — every property is a `val` of an immutable type. Declaring them stable here lets Compose
// skip recomposition for composables that take them, WITHOUT leaking a Compose dependency into the
// domain layer. This is the multi-module-friendly alternative to scattering @Immutable across :shared.
// See docs/adr/0003-two-module-structure.md.
app.opensefer.core.model.*
app.opensefer.core.domain.ReadingPreferences
