name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (detekt + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Static analysis
        run: ./gradlew detekt --stacktrace
      - name: Unit tests (shared logic + ViewModels)
        run: ./gradlew :shared:testDebugUnitTest :composeApp:testDebugUnitTest --stacktrace
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-reports
          path: |
            **/build/reports/detekt/
            **/build/reports/tests/
          if-no-files-found: ignore

  android:
    name: Android (assemble debug)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # The Android SDK is preinstalled on GitHub runners; AGP reads ANDROID_HOME,
      # so no local.properties is needed here.
      - name: Assemble debug APK
        run: ./gradlew :composeApp:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: composeApp-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  ios:
    name: iOS (link framework + tests)
    runs-on: macos-14
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Kotlin/Native downloads its toolchain into ~/.konan — cache it across runs.
      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-
      - name: Link iOS simulator framework
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --stacktrace
      - name: Shared tests on iOS simulator
        run: ./gradlew :shared:iosSimulatorArm64Test --stacktrace
